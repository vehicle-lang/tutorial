name: CI

on:
  push:
    branches:
      - exercises
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

defaults:
  run:
    shell: sh

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🛠️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ Setup Python dependencies
        run: pip install -r requirements.txt

      - name: 🔍 Report tool versions
        run: |
          vehicle --version
          Marabou --version || true

      # Type-check every specification in the repository. Files containing
      # fill-in-the-blanks placeholders are skipped, since they are meant not
      # to compile until the reader completes them.
      - name: 🏗️ Type-check all specifications
        run: |
          status=0
          for spec in $(git ls-files '*.vcl'); do
            if grep -q 'your answer here' "$spec"; then
              echo "skipping  $spec (exercise with placeholders)"
              continue
            fi
            echo "checking  $spec"
            vehicle typecheck --specification "$spec" || status=1
          done
          exit $status

      # Type-checking alone cannot catch changes to the `vehicle verify`
      # command line, so run one real verification end to end. This is the
      # check that would have caught `--verifier` being renamed `--solver`.
      #
      # Note: ACAS Xu property 3 is *false* for network 1_7, so Marabou is
      # expected to report a counterexample. `vehicle verify` still exits 0 in
      # that case, because the verification itself succeeded. The step fails
      # only if the command line or the tool chain is broken.
      - name: ✅ Verify the Chapter 2 example
        run: |
          vehicle verify \
            --specification acasXu.vcl \
            --network acasXu:acasXu_1_7.onnx \
            --property property3 \
            --solver Marabou
        working-directory: chapter-2/chapter-code
